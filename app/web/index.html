<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <title>DSH Phone</title>
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <!--
      WebView shell. All content is rendered by ./js/app.js (ES modules, no build
      step). The same files are served by:
        - Android: app/android/app/src/main/assets/web/ (WebView origin
          https://appassets.local, synced by scripts/sync_web.ps1), and
        - the browser demo: `python -m http.server` from app/web/.
      Keep every asset path relative (./js/..., ./css/...) for both origins.
    -->
    <div id="app" data-app-ready="false">
      <noscript>
        <p style="padding: 24px; font-family: sans-serif">
          DSH Phone 需要 JavaScript。/ DSH Phone requires JavaScript.
        </p>
      </noscript>
      <div class="boot-placeholder" role="status" aria-live="polite">
        <p>正在启动… / Starting…</p>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
