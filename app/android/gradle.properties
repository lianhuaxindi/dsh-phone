# Android 壳的 Gradle 全局配置。不要在仓库中提交 local.properties / keystore。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 本仓库的 Windows 工作区路径含中文（D:\code\apps\手机端），AGP 默认会以
# "Your project path contains non-ASCII characters" 直接拒绝构建。CI（ubuntu 英文路径）
# 不受影响；本地构建用该开关放行。若工具链在非 ASCII 路径下出现资源/路径问题，
# 可把仓库复制到纯 ASCII 路径再构建（见 app/android/BUILD-LOCAL.md）。
android.overridePathCheck=true
